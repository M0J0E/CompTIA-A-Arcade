<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompTIA A+ Arcade</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .game-container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 35px;
    }

    .game-button {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .game-button:active {
      transform: scale(0.97);
    }

    #gameScreen {
      display: none;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .question-box {
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
    }

    .answer {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 2px solid #374151;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 18px;
    }

    .answer:active {
      background: #2563eb;
    }
    
    .battle-arena {
  margin-bottom: 25px;
  padding: 20px;
  border-radius: 20px;

  background-image: url("assets/battle-bg.PNG");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
<div id="bossBanner" style="display:none; margin-bottom:15px; font-size:26px; font-weight:bold;">
  👑 BOSS BATTLE 👑
</div>

<div style="margin-bottom:15px;">
  Enemies Defeated:
  <strong id="enemyCount">0</strong>
</div>
    
.battle-field {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  min-height: 220px;
  gap: 20px;
}
.battle-field {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  min-height: 320px;
  gap: 20px;
}
    
.fighter {
  width: 45%;
  transition: transform 0.2s;
}

.character {
  font-size: 80px;
  margin-bottom: 10px;
}
    
.character img {
  width: 140px;
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto 10px;
}
    
.health-container {
  width: 100%;
  height: 18px;
  background: #374151;
  border-radius: 20px;
  overflow: hidden;
}

.health-bar {
  width: 100%;
  height: 100%;
  background: #22c55e;
  transition: width 0.4s;
}

.enemy-health {
  background: #ef4444;
}

.hp-text {
  font-size: 14px;
  margin-top: 5px;
}

.player-attack {
  animation: playerAttack 0.4s;
}

.enemy-attack {
  animation: enemyAttack 0.4s;
}
    
.character {
  position: relative;
}

.damage-number {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: bold;
  color: red;
  animation: damageFloat 0.7s ease-out forwards;
  pointer-events: none;
}

@keyframes damageFloat {
  0% {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -60px);
  }
}
    
@keyframes playerAttack {
  0% {
    transform: translateX(0);
  }

  50% {
    transform: translateX(45px);
  }

  100% {
    transform: translateX(0);
  }
}

@keyframes enemyAttack {
  0% {
    transform: translateX(0);
  }

  50% {
    transform: translateX(-45px);
  }

  100% {
    transform: translateX(0);
  }
}
  </style>
</head>

<body>

<div class="game-container">

  <div id="mainMenu">

    <h1>CompTIA A+ Arcade</h1>

    <p class="subtitle">
      Learn. Battle. Level Up.
    </p>

    <button class="game-button" onclick="startGame('battle')">
      ⚔️ Battle Mode
    </button>

    <button class="game-button" onclick="startGame('race')">
      🏎️ Race Mode
    </button>

    <button class="game-button" onclick="startGame('tower')">
      🏰 Tower Climb
    </button>

    <button class="game-button" onclick="startGame('survival')">
      ❤️ Survival Mode
    </button>

    <button class="game-button" onclick="startGame('exam')">
      📝 Practice Exam
    </button>

  </div>


  <div id="gameScreen">

    <div class="stats">
      <span id="modeName">Battle Mode</span>
      <span>XP: <span id="xp">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
    </div>
<div id="battleArena" class="battle-arena">

  <div class="battle-field">

    <div class="fighter">

      <div id="playerCharacter" class="character">
  <img src="assets/player.PNG" alt="Player character">
</div>

      <strong>You</strong>

      <div class="health-container">
        <div
          id="playerHealthBar"
          class="health-bar">
        </div>
      </div>

      <div id="playerHPText" class="hp-text">
        100 HP
      </div>

    </div>


    <div class="fighter">

      <div id="enemyCharacter" class="character">
  <img src="assets/enemy.PNG" alt="Enemy character">
</div>

      <strong id="enemyName">
        Malware Bot Lv. 1
      </strong>

      <div class="health-container">
        <div
          id="enemyHealthBar"
          class="health-bar enemy-health">
        </div>
      </div>

      <div id="enemyHPText" class="hp-text">
        100 HP
      </div>

    </div>

  </div>

</div>

    <div class="question-box">

      <h2 id="question">
        Which port does HTTPS use?
      </h2>

      <button class="answer" onclick="answerQuestion(21)">
        A. 21
      </button>

      <button class="answer" onclick="answerQuestion(22)">
        B. 22
      </button>

      <button class="answer" onclick="answerQuestion(80)">
        C. 80
      </button>

      <button class="answer" onclick="answerQuestion(443)">
        D. 443
      </button>

      <p id="result"></p>

    </div>

  </div>
<button id="backToMenuButton" class="game-button" style="display:none;">
  ⬅️ Back to Menu
</button>
</div>


<script src="questions.js"></script>
<script src="battle.js"></script>

<script>
let xp = 0;
let lives = 3;
let currentQuestion = null;
let currentMode = "battle";

function startGame(mode) {
  currentMode = mode;

  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  const names = {
    battle: "⚔️ Battle Mode",
    race: "🏎️ Race Mode",
    tower: "🏰 Tower Climb",
    survival: "❤️ Survival Mode",
    exam: "📝 Practice Exam"
  };

  document.getElementById("modeName").innerText = names[mode];if (mode === "battle") {
  setupBattle();
}

  loadQuestion();
}

function loadQuestion() {
  currentQuestion =
    questions[Math.floor(Math.random() * questions.length)];

  document.getElementById("question").innerText =
    currentQuestion.question;

  const answerButtons =
    document.querySelectorAll(".answer");

  answerButtons.forEach((button, index) => {
    button.innerText =
      String.fromCharCode(65 + index) +
      ". " +
      currentQuestion.answers[index];

    button.disabled = false;

    button.onclick = function () {
      answerQuestion(index);
    };
  });

  document.getElementById("result").innerHTML =
    "Category: " + currentQuestion.category;
}

function answerQuestion(selectedIndex) {
  const result = document.getElementById("result");

  const answerButtons =
    document.querySelectorAll(".answer");

  answerButtons.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === currentQuestion.correct) {
    xp += 10; if (currentMode === "battle") {
  correctBattleAnswer();
}

    document.getElementById("xp").innerText = xp;

    result.innerHTML =
      "✅ Correct! +10 XP<br><br>" +
      currentQuestion.explanation;
  } else {
    lives--;if (currentMode === "battle") {
  wrongBattleAnswer();
}

    document.getElementById("lives").innerText = lives;

    const correctAnswer =
      currentQuestion.answers[currentQuestion.correct];

    result.innerHTML =
      "❌ Incorrect<br><br>" +
      "Correct answer: " +
      correctAnswer +
      "<br><br>" +
      currentQuestion.explanation;
  }

  setTimeout(() => {
    if (lives <= 0) {
      gameOver();
    } else {
      loadQuestion();
    }
  }, 2500);
}

function gameOver() {
  document.getElementById("question").innerText =
    "Game Over";

  document.getElementById("result").innerHTML =
    "Final XP: " + xp +
    "<br><br>Refresh the page to play again.";

  document.querySelectorAll(".answer")
    .forEach(button => {
      button.style.display = "none";
    });
}
</script>

</body>
</html>
