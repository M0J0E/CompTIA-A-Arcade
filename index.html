<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompTIA A+ Arcade</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .game-container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 35px;
    }

    .game-button {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .game-button:active {
      transform: scale(0.97);
    }

    #gameScreen {
      display: none;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .question-box {
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
    }

    .answer {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 2px solid #374151;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 18px;
    }

    .answer:active {
      background: #2563eb;
    }
  </style>
</head>

<body>

<div class="game-container">

  <div id="mainMenu">

    <h1>CompTIA A+ Arcade</h1>

    <p class="subtitle">
      Learn. Battle. Level Up.
    </p>

    <button class="game-button" onclick="startGame('battle')">
      ⚔️ Battle Mode
    </button>

    <button class="game-button" onclick="startGame('race')">
      🏎️ Race Mode
    </button>

    <button class="game-button" onclick="startGame('tower')">
      🏰 Tower Climb
    </button>

    <button class="game-button" onclick="startGame('survival')">
      ❤️ Survival Mode
    </button>

    <button class="game-button" onclick="startGame('exam')">
      📝 Practice Exam
    </button>

  </div>


  <div id="gameScreen">

    <div class="stats">
      <span id="modeName">Battle Mode</span>
      <span>XP: <span id="xp">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
    </div>

    <div class="question-box">

      <h2 id="question">
        Which port does HTTPS use?
      </h2>

      <button class="answer" onclick="answerQuestion(21)">
        A. 21
      </button>

      <button class="answer" onclick="answerQuestion(22)">
        B. 22
      </button>

      <button class="answer" onclick="answerQuestion(80)">
        C. 80
      </button>

      <button class="answer" onclick="answerQuestion(443)">
        D. 443
      </button>

      <p id="result"></p>

    </div>

  </div>

</div>


<script src="questions.js"></script>

<script>
let xp = 0;
let lives = 3;
let currentQuestion = null;
let currentMode = "battle";

function startGame(mode) {
  currentMode = mode;

  document.getElementById("mainMenu").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";

  const names = {
    battle: "⚔️ Battle Mode",
    race: "🏎️ Race Mode",
    tower: "🏰 Tower Climb",
    survival: "❤️ Survival Mode",
    exam: "📝 Practice Exam"
  };

  document.getElementById("modeName").innerText = names[mode];

  loadQuestion();
}

function loadQuestion() {
  currentQuestion =
    questions[Math.floor(Math.random() * questions.length)];

  document.getElementById("question").innerText =
    currentQuestion.question;

  const answerButtons =
    document.querySelectorAll(".answer");

  answerButtons.forEach((button, index) => {
    button.innerText =
      String.fromCharCode(65 + index) +
      ". " +
      currentQuestion.answers[index];

    button.disabled = false;

    button.onclick = function () {
      answerQuestion(index);
    };
  });

  document.getElementById("result").innerHTML =
    "Category: " + currentQuestion.category;
}

function answerQuestion(selectedIndex) {
  const result = document.getElementById("result");

  const answerButtons =
    document.querySelectorAll(".answer");

  answerButtons.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === currentQuestion.correct) {
    xp += 10;

    document.getElementById("xp").innerText = xp;

    result.innerHTML =
      "✅ Correct! +10 XP<br><br>" +
      currentQuestion.explanation;
  } else {
    lives--;

    document.getElementById("lives").innerText = lives;

    const correctAnswer =
      currentQuestion.answers[currentQuestion.correct];

    result.innerHTML =
      "❌ Incorrect<br><br>" +
      "Correct answer: " +
      correctAnswer +
      "<br><br>" +
      currentQuestion.explanation;
  }

  setTimeout(() => {
    if (lives <= 0) {
      gameOver();
    } else {
      loadQuestion();
    }
  }, 2500);
}

function gameOver() {
  document.getElementById("question").innerText =
    "Game Over";

  document.getElementById("result").innerHTML =
    "Final XP: " + xp +
    "<br><br>Refresh the page to play again.";

  document.querySelectorAll(".answer")
    .forEach(button => {
      button.style.display = "none";
    });
}
</script>

</body>
</html>
