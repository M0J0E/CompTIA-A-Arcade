<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>
    CompTIA A+ Arcade
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      font-family:
        Arial,
        sans-serif;

      background:
        #0f172a;

      color:
        white;
    }


    body {
      overflow-x: hidden;
    }


    button {
      font-family: inherit;
    }



    /* ================================================= */
    /* MAIN MENU                                         */
    /* ================================================= */

    #mainMenu {

      min-height:
        100vh;

      width:
        100%;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      padding:
        30px 20px;


      background:

        linear-gradient(
          rgba(15, 23, 42, 0.35),
          rgba(15, 23, 42, 0.88)
        ),

        url(
          "assets/battle-bg.png"
        );


      background-size:
        cover;

      background-position:
        center;

      background-repeat:
        no-repeat;
    }


    .menu-panel {

      width:
        100%;

      max-width:
        600px;

      padding:
        28px;

      border-radius:
        28px;

      background:
        rgba(
          15,
          23,
          42,
          0.82
        );

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.14
        );

      box-shadow:
        0 20px 50px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    .menu-title {

      font-size:
        42px;

      margin:
        0 0 5px;

      text-align:
        center;
    }


    .menu-subtitle {

      text-align:
        center;

      color:
        #cbd5e1;

      margin-bottom:
        25px;
    }


    .game-button {

      width:
        100%;

      padding:
        17px;

      margin:
        8px 0;

      border:
        none;

      border-radius:
        18px;

      font-size:
        19px;

      font-weight:
        bold;

      background:
        #2563eb;

      color:
        white;

      cursor:
        pointer;

      box-shadow:
        0 8px 20px
        rgba(
          0,
          0,
          0,
          0.22
        );

      transition:
        transform 0.12s,
        opacity 0.12s;
    }


    .game-button:active {

      transform:
        scale(0.97);
    }


    .game-button:disabled {

      opacity:
        0.5;

      cursor:
        default;
    }



    /* ================================================= */
    /* GAME                                              */
    /* ================================================= */

    #gameScreen {

      display:
        none;

      position:
        relative;

      min-height:
        100vh;

      width:
        100%;

      overflow:
        hidden;


      background-image:

        linear-gradient(
          rgba(0,0,0,0.05),
          rgba(0,0,0,0.35)
        ),

        url(
          "assets/battle-bg.png"
        );


      background-size:
        cover;

      background-position:
        center;

      background-repeat:
        no-repeat;
    }


    .game-overlay {

      min-height:
        100vh;

      display:
        flex;

      flex-direction:
        column;

      padding:
        12px 14px 14px;
    }



    /* ================================================= */
    /* HUD                                               */
    /* ================================================= */

    .top-hud {

      display:
        grid;

      grid-template-columns:
        1fr auto auto;

      align-items:
        center;

      gap:
        8px;

      padding:
        10px 12px;

      border-radius:
        18px;

      background:
        rgba(
          15,
          23,
          42,
          0.76
        );

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      z-index:
        20;
    }


    #modeName {

      font-weight:
        bold;

      font-size:
        15px;
    }


    .hud-stat {

      padding:
        6px 10px;

      border-radius:
        12px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      white-space:
        nowrap;

      font-weight:
        bold;
    }



    /* ================================================= */
    /* CAMPAIGN PROGRESS                                 */
    /* ================================================= */

    .campaign-progress-wrap {

      margin-top:
        8px;

      padding:
        8px 10px;

      border-radius:
        14px;

      background:
        rgba(
          15,
          23,
          42,
          0.68
        );

      backdrop-filter:
        blur(6px);

      -webkit-backdrop-filter:
        blur(6px);
    }


    .campaign-progress-top {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        10px;

      margin-bottom:
        6px;

      font-size:
        12px;

      font-weight:
        bold;
    }


    .campaign-progress-bar {

      width:
        100%;

      height:
        9px;

      border-radius:
        999px;

      overflow:
        hidden;

      background:
        rgba(
          255,
          255,
          255,
          0.15
        );
    }


    #campaignProgressFill {

      width:
        0%;

      height:
        100%;

      background:
        #3b82f6;

      transition:
        width 0.3s ease;
    }



    /* ================================================= */
    /* BATTLE ARENA                                      */
    /* ================================================= */

    #battleArena {

      position:
        relative;

      flex:
        1;

      min-height:
        340px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      padding:
        12px 4px 0;
    }


    #bossBanner {

      display:
        none;

      position:
        absolute;

      top:
        12px;

      left:
        50%;

      transform:
        translateX(-50%);

      z-index:
        12;

      padding:
        9px 18px;

      border-radius:
        16px;

      background:
        rgba(
          126,
          34,
          206,
          0.9
        );

      font-size:
        22px;

      font-weight:
        bold;

      white-space:
        nowrap;
    }


    .enemy-counter {

      position:
        absolute;

      top:
        12px;

      right:
        4px;

      z-index:
        10;

      padding:
        8px 11px;

      border-radius:
        13px;

      background:
        rgba(
          15,
          23,
          42,
          0.74
        );

      font-size:
        13px;

      font-weight:
        bold;
    }


    .battle-field {

      width:
        100%;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap:
        18px;

      padding:
        65px 10px 10px;
    }


    .fighter {

      width:
        46%;

      max-width:
        240px;

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;
    }


    .character {

      position:
        relative;

      width:
        100%;

      display:
        flex;

      justify-content:
        center;

      align-items:
        flex-end;

      min-height:
        170px;
    }


    .character img {

      display:
        block;

      width:
        165px;

      max-width:
        100%;

      height:
        auto;

      object-fit:
        contain;

      filter:
        drop-shadow(
          0 10px 12px
          rgba(0,0,0,0.35)
        );
    }


    .fighter-name {

      margin-top:
        3px;

      margin-bottom:
        7px;

      padding:
        5px 10px;

      border-radius:
        10px;

      background:
        rgba(
          15,
          23,
          42,
          0.68
        );

      font-size:
        14px;
    }



    /* ================================================= */
    /* HP                                                */
    /* ================================================= */

    .health-container {

      width:
        100%;

      max-width:
        210px;

      height:
        17px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        rgba(
          15,
          23,
          42,
          0.85
        );

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.85
        );
    }


    .health-bar {

      width:
        100%;

      height:
        100%;

      background:
        #22c55e;

      transition:
        width 0.35s ease;
    }


    .enemy-health {

      background:
        #ef4444;
    }


    .hp-text {

      margin-top:
        5px;

      padding:
        3px 7px;

      border-radius:
        8px;

      background:
        rgba(
          15,
          23,
          42,
          0.64
        );

      font-size:
        12px;

      font-weight:
        bold;
    }



    /* ================================================= */
    /* QUESTION PANEL                                    */
    /* ================================================= */

    .question-panel {

      width:
        100%;

      max-width:
        760px;

      margin:
        0 auto 8px;

      padding:
        15px;

      border-radius:
        24px;

      background:
        rgba(
          15,
          23,
          42,
          0.88
        );

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.12
        );
    }


    #category {

      margin-bottom:
        7px;

      color:
        #93c5fd;

      font-size:
        12px;

      font-weight:
        bold;
    }


    #question {

      margin:
        0 0 10px;

      font-size:
        19px;

      line-height:
        1.35;
    }


    #questionInstructions {

      margin-bottom:
        10px;

      color:
        #fde047;

      font-size:
        13px;

      font-weight:
        bold;
    }



    /* ================================================= */
    /* ANSWERS                                           */
    /* ================================================= */

    #answersContainer {

      display:
        grid;

      gap:
        7px;
    }


    .answer {

      width:
        100%;

      padding:
        12px 14px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.15
        );

      border-radius:
        15px;

      background:
        rgba(
          2,
          6,
          23,
          0.76
        );

      color:
        white;

      font-size:
        15px;

      text-align:
        left;

      line-height:
        1.25;

      cursor:
        pointer;
    }


    .answer.selected {

      background:
        rgba(
          37,
          99,
          235,
          0.94
        );

      border-color:
        #93c5fd;
    }


    .answer.correct-answer {

      background:
        rgba(
          22,
          101,
          52,
          0.96
        );

      border-color:
        #4ade80;
    }


    .answer.wrong-answer {

      background:
        rgba(
          153,
          27,
          27,
          0.96
        );

      border-color:
        #f87171;
    }


    #submitAnswerButton {

      display:
        none;

      margin-top:
        10px;

      background:
        #16a34a;
    }


    #result {

      margin:
        10px 0 0;

      font-size:
        14px;

      line-height:
        1.35;
    }



    /* ================================================= */
    /* BACK                                              */
    /* ================================================= */

    #backToMenuButton {

      max-width:
        760px;

      margin:
        0 auto 8px;

      padding:
        11px;

      font-size:
        15px;

      background:
        rgba(
          15,
          23,
          42,
          0.82
        );
    }



    /* ================================================= */
    /* ANIMATIONS                                        */
    /* ================================================= */

    .player-attack {
      animation:
        playerAttack 0.38s;
    }


    .enemy-attack {
      animation:
        enemyAttack 0.38s;
    }


    @keyframes playerAttack {

      0% {
        transform:
          translateX(0);
      }

      50% {
        transform:
          translateX(50px)
          scale(1.05);
      }

      100% {
        transform:
          translateX(0);
      }
    }


    @keyframes enemyAttack {

      0% {
        transform:
          translateX(0);
      }

      50% {
        transform:
          translateX(-50px)
          scale(1.05);
      }

      100% {
        transform:
          translateX(0);
      }
    }


    .damage-number {

      position:
        absolute;

      top:
        15px;

      left:
        50%;

      transform:
        translateX(-50%);

      z-index:
        50;

      font-size:
        30px;

      font-weight:
        bold;

      color:
        #ef4444;

      text-shadow:
        0 3px 5px black;

      animation:
        damageFloat
        0.8s
        ease-out
        forwards;

      pointer-events:
        none;
    }


    @keyframes damageFloat {

      from {

        opacity:
          1;

        transform:
          translate(-50%, 0);
      }

      to {

        opacity:
          0;

        transform:
          translate(-50%, -70px);
      }
    }



    /* ================================================= */
    /* IPAD / DESKTOP                                    */
    /* ================================================= */

    @media
    (min-width: 700px) {

      .game-overlay {

        max-width:
          900px;

        margin:
          auto;
      }


      .character img {

        width:
          210px;
      }


      .character {

        min-height:
          225px;
      }


      #question {

        font-size:
          21px;
      }


      #answersContainer {

        grid-template-columns:
          1fr 1fr;
      }


      .answer {

        min-height:
          58px;
      }
    }



    /* ================================================= */
    /* PHONE                                             */
    /* ================================================= */

    @media
    (max-width: 450px) {

      .game-overlay {

        padding-left:
          9px;

        padding-right:
          9px;
      }


      #battleArena {

        min-height:
          280px;
      }


      .character {

        min-height:
          135px;
      }


      .character img {

        width:
          125px;
      }


      #question {

        font-size:
          16px;
      }


      .answer {

        padding:
          10px 11px;

        font-size:
          14px;
      }
    }

  </style>

</head>


<body>


<!-- ================================================= -->
<!-- MENU                                              -->
<!-- ================================================= -->

<div id="mainMenu">

  <div class="menu-panel">

    <h1 class="menu-title">
      CompTIA A+ Arcade
    </h1>

    <p class="menu-subtitle">
      Learn. Battle. Level Up.
    </p>


    <button
      class="game-button"
      onclick="startGame('battle')"
    >
      ⚔️ Campaign Battle
    </button>


    <button
      class="game-button"
      onclick="startGame('race')"
    >
      🏎️ Race Mode
    </button>


    <button
      class="game-button"
      onclick="startGame('tower')"
    >
      🏰 Tower Climb
    </button>


    <button
      class="game-button"
      onclick="startGame('survival')"
    >
      ❤️ Survival Mode
    </button>


    <button
      class="game-button"
      onclick="startGame('exam')"
    >
      📝 Practice Exam
    </button>

  </div>

</div>



<!-- ================================================= -->
<!-- GAME                                              -->
<!-- ================================================= -->

<div id="gameScreen">

  <div class="game-overlay">


    <!-- HUD -->

    <div class="top-hud">

      <span id="modeName">
        ⚔️ Campaign Battle
      </span>

      <span class="hud-stat">
        ⭐
        <span id="xp">
          0
        </span>
        XP
      </span>

      <span class="hud-stat">
        ❤️
        <span id="lives">
          3
        </span>
      </span>

    </div>



    <!-- PROGRESS -->

    <div
      id="campaignProgressWrap"
      class="campaign-progress-wrap"
    >

      <div class="campaign-progress-top">

        <span id="campaignQuestionText">
          Campaign 1
        </span>

        <span id="bossProgressText">
          Boss in 9
        </span>

      </div>


      <div class="campaign-progress-bar">

        <div id="campaignProgressFill">
        </div>

      </div>

    </div>



    <!-- BATTLE -->

    <div id="battleArena">


      <div id="bossBanner">
        👑 BOSS BATTLE 👑
      </div>


      <div class="enemy-counter">

        Question:

        <span id="enemyCount">
          1/1
        </span>

      </div>


      <div class="battle-field">


        <!-- PLAYER -->

        <div class="fighter">

          <div
            id="playerCharacter"
            class="character"
          >

            <img
              src="assets/player.png"
              alt="Player character"
            >

          </div>


          <div class="fighter-name">
            You
          </div>


          <div class="health-container">

            <div
              id="playerHealthBar"
              class="health-bar"
            >
            </div>

          </div>


          <div
            id="playerHPText"
            class="hp-text"
          >
            100 / 100 HP
          </div>

        </div>



        <!-- ENEMY -->

        <div class="fighter">

          <div
            id="enemyCharacter"
            class="character"
          >

            <img
              src="assets/enemy.png"
              alt="Enemy character"
            >

          </div>


          <div
            id="enemyName"
            class="fighter-name"
          >
            Malware Bot Lv. 1
          </div>


          <div class="health-container">

            <div
              id="enemyHealthBar"
              class="health-bar enemy-health"
            >
            </div>

          </div>


          <div
            id="enemyHPText"
            class="hp-text"
          >
            100 / 100 HP
          </div>

        </div>

      </div>

    </div>



    <!-- QUESTION -->

    <div class="question-panel">


      <div id="category">
        CompTIA A+
      </div>


      <h2 id="question">
        Loading question...
      </h2>


      <div id="questionInstructions">
      </div>


      <div id="answersContainer">
      </div>


      <button
        id="submitAnswerButton"
        class="game-button"
        type="button"
      >
        ✅ Submit Answer
      </button>


      <p id="result"></p>

    </div>



    <button
      id="backToMenuButton"
      class="game-button"
      type="button"
    >
      ⬅️ Back to Menu
    </button>


  </div>

</div>



<!-- ================================================= -->
<!-- FILES                                             -->
<!-- ================================================= -->

<script src="questions.js"></script>

<script src="battle.js"></script>



<script>


/* ===================================================== */
/* MAIN STATE                                            */
/* ===================================================== */

let xp = 0;

let lives = 3;

let currentQuestion = null;

let currentMode = null;

let questionLocked = false;

let selectedAnswers = [];

let previousQuestionId = null;

let campaignQuestions = [];


/* ===================================================== */
/* START                                                 */
/* ===================================================== */

function startGame(
  mode
) {

  currentMode =
    mode;

  xp =
    0;

  lives =
    3;

  previousQuestionId =
    null;

  selectedAnswers =
    [];

  questionLocked =
    false;


  document.getElementById(
    "xp"
  ).innerText =
    xp;


  document.getElementById(
    "lives"
  ).innerText =
    lives;


  document.getElementById(
    "mainMenu"
  ).style.display =
    "none";


  document.getElementById(
    "gameScreen"
  ).style.display =
    "block";


  const names = {

    battle:
      "⚔️ Campaign Battle",

    race:
      "🏎️ Race Mode",

    tower:
      "🏰 Tower Climb",

    survival:
      "❤️ Survival Mode",

    exam:
      "📝 Practice Exam"
  };


  document.getElementById(
    "modeName"
  ).innerText =
    names[mode];


  if (
    mode === "battle"
  ) {

    document.getElementById(
      "battleArena"
    ).style.display =
      "flex";


    document.getElementById(
      "campaignProgressWrap"
    ).style.display =
      "block";


    campaignQuestions =
      getPlayableQuestions()
        .sort(
          (a, b) =>
            a.id - b.id
        );


    setupBattle();


    loadCampaignQuestion(
      0
    );


    return;
  }


  document.getElementById(
    "battleArena"
  ).style.display =
    "none";


  document.getElementById(
    "campaignProgressWrap"
  ).style.display =
    "none";


  loadQuestion();
}


/* ===================================================== */
/* PLAYABLE QUESTIONS                                    */
/* ===================================================== */

function getPlayableQuestions() {

  if (
    typeof questions ===
    "undefined"
  ) {
    return [];
  }


  return questions.filter(
    question => {

      if (
        question.pbq ===
        true
      ) {
        return false;
      }


      if (
        !Array.isArray(
          question.answers
        )
      ) {
        return false;
      }


      if (
        question.answers.length ===
        0
      ) {
        return false;
      }


      if (
        question.correct === null ||
        question.correct === undefined
      ) {
        return false;
      }


      if (
        question.multiple === true &&
        Array.isArray(
          question.correct
        ) &&
        question.correct.length < 2
      ) {
        return false;
      }


      return true;
    }
  );
}


/* ===================================================== */
/* CAMPAIGN QUESTION                                     */
/* ===================================================== */

function loadCampaignQuestion(
  campaignIndex
) {

  questionLocked =
    false;

  selectedAnswers =
    [];


  if (
    campaignIndex >=
    campaignQuestions.length
  ) {

    campaignVictory();

    return;
  }


  currentQuestion =
    campaignQuestions[
      campaignIndex
    ];


  previousQuestionId =
    currentQuestion.id;


  renderCurrentQuestion();

  updateCampaignDisplay();
}


/* ===================================================== */
/* RANDOM QUESTION                                       */
/* ===================================================== */

function loadQuestion() {

  if (
    currentMode ===
    "battle"
  ) {

    loadCampaignQuestion(
      questionsAnswered
    );

    return;
  }


  questionLocked =
    false;

  selectedAnswers =
    [];


  const playableQuestions =
    getPlayableQuestions();


  if (
    playableQuestions.length ===
    0
  ) {

    document.getElementById(
      "question"
    ).innerText =
      "No playable questions found.";

    return;
  }


  let availableQuestions =
    playableQuestions.filter(
      question =>
        question.id !==
        previousQuestionId
    );


  if (
    availableQuestions.length ===
    0
  ) {
    availableQuestions =
      playableQuestions;
  }


  currentQuestion =
    availableQuestions[
      Math.floor(
        Math.random() *
        availableQuestions.length
      )
    ];


  previousQuestionId =
    currentQuestion.id;


  renderCurrentQuestion();
}


/* ===================================================== */
/* RENDER QUESTION                                       */
/* ===================================================== */

function renderCurrentQuestion() {

  document.getElementById(
    "question"
  ).innerText =
    currentQuestion.question;


  document.getElementById(
    "category"
  ).innerText =
    "📚 " +

    (
      currentQuestion.category ||
      "CompTIA A+ 220-1201"
    )

    +

    " • Question #" +

    currentQuestion.id;


  document.getElementById(
    "result"
  ).innerHTML =
    "";


  const instructions =
    document.getElementById(
      "questionInstructions"
    );


  const submitButton =
    document.getElementById(
      "submitAnswerButton"
    );


  submitButton.disabled =
    true;


  if (
    Array.isArray(
      currentQuestion.correct
    )
  ) {

    const required =
      currentQuestion.correct.length;


    instructions.innerText =
      "Select " +
      numberToWord(required) +
      " answers";


    submitButton.style.display =
      "block";

  } else {

    instructions.innerText =
      "Select the best answer";


    submitButton.style.display =
      "none";
  }


  createAnswerButtons();
}


/* ===================================================== */
/* PROGRESS DISPLAY                                      */
/* ===================================================== */

function updateCampaignDisplay() {

  if (
    currentMode !==
    "battle"
  ) {
    return;
  }


  const total =
    campaignQuestions.length;


  if (
    total === 0
  ) {
    return;
  }


  const currentNumber =
    Math.min(
      questionsAnswered + 1,
      total
    );


  document.getElementById(
    "campaignQuestionText"
  ).innerText =
    "Campaign " +
    currentNumber +
    "/" +
    total;


  if (
    currentNumber === total
  ) {

    document.getElementById(
      "bossProgressText"
    ).innerText =
      "👑 FINAL BOSS";


    document.getElementById(
      "campaignProgressFill"
    ).style.width =
      "100%";


    return;
  }


  if (
    currentNumber ===
    total - 1
  ) {

    document.getElementById(
      "bossProgressText"
    ).innerText =
      "⚔️ FINAL GUARDIAN";

    return;
  }


  const positionInStage =
    (
      (
        currentNumber - 1
      ) %
      10
    ) + 1;


  const questionsUntilBoss =
    10 -
    positionInStage;


  if (
    positionInStage === 10
  ) {

    document.getElementById(
      "bossProgressText"
    ).innerText =
      "👑 BOSS";

  } else {

    document.getElementById(
      "bossProgressText"
    ).innerText =
      "Boss in " +
      questionsUntilBoss;
  }


  document.getElementById(
    "campaignProgressFill"
  ).style.width =
    (
      positionInStage *
      10
    ) +
    "%";
}


/* ===================================================== */
/* ANSWERS                                               */
/* ===================================================== */

function createAnswerButtons() {

  const container =
    document.getElementById(
      "answersContainer"
    );


  container.innerHTML =
    "";


  currentQuestion.answers.forEach(
    (
      answer,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "answer";


      button.innerText =
        String.fromCharCode(
          65 + index
        ) +
        ". " +
        answer;


      if (
        Array.isArray(
          currentQuestion.correct
        )
      ) {

        button.onclick =
          function () {

            toggleAnswer(
              index,
              button
            );
          };

      } else {

        button.onclick =
          function () {

            submitSingleAnswer(
              index
            );
          };
      }


      container.appendChild(
        button
      );
    }
  );
}


/* ===================================================== */
/* MULTI SELECT                                          */
/* ===================================================== */

function toggleAnswer(
  index,
  button
) {

  if (
    questionLocked
  ) {
    return;
  }


  const required =
    currentQuestion.correct.length;


  const existing =
    selectedAnswers.indexOf(
      index
    );


  if (
    existing !== -1
  ) {

    selectedAnswers.splice(
      existing,
      1
    );


    button.classList.remove(
      "selected"
    );

  } else {

    if (
      selectedAnswers.length >=
      required
    ) {
      return;
    }


    selectedAnswers.push(
      index
    );


    button.classList.add(
      "selected"
    );
  }


  document.getElementById(
    "submitAnswerButton"
  ).disabled =
    selectedAnswers.length !==
    required;
}


/* ===================================================== */
/* SUBMIT                                                */
/* ===================================================== */

function submitSingleAnswer(
  selectedIndex
) {

  if (
    questionLocked
  ) {
    return;
  }


  evaluateAnswer(
    [selectedIndex]
  );
}


function submitMultipleAnswer() {

  if (
    questionLocked
  ) {
    return;
  }


  if (
    !Array.isArray(
      currentQuestion.correct
    )
  ) {
    return;
  }


  if (
    selectedAnswers.length !==
    currentQuestion.correct.length
  ) {
    return;
  }


  evaluateAnswer(
    [...selectedAnswers]
  );
}


/* ===================================================== */
/* GRADE                                                 */
/* ===================================================== */

function evaluateAnswer(
  userAnswers
) {

  questionLocked =
    true;


  const correctAnswers =
    Array.isArray(
      currentQuestion.correct
    )
      ? [...currentQuestion.correct]
      : [currentQuestion.correct];


  const selected =
    [...userAnswers]
      .sort(
        (a, b) =>
          a - b
      );


  const correct =
    [...correctAnswers]
      .sort(
        (a, b) =>
          a - b
      );


  const isCorrect =
    selected.length ===
      correct.length &&

    selected.every(
      (
        value,
        index
      ) =>
        value ===
        correct[index]
    );


  highlightAnswers(
    selected,
    correct
  );


  if (isCorrect) {
    handleCorrectAnswer();
  } else {
    handleWrongAnswer();
  }
}


/* ===================================================== */
/* HIGHLIGHT                                             */
/* ===================================================== */

function highlightAnswers(
  selected,
  correct
) {

  const buttons =
    document.querySelectorAll(
      "#answersContainer .answer"
    );


  buttons.forEach(
    (
      button,
      index
    ) => {

      button.disabled =
        true;


      if (
        correct.includes(
          index
        )
      ) {

        button.classList.add(
          "correct-answer"
        );

      } else if (
        selected.includes(
          index
        )
      ) {

        button.classList.add(
          "wrong-answer"
        );
      }
    }
  );
}


/* ===================================================== */
/* CORRECT                                               */
/* ===================================================== */

function handleCorrectAnswer() {

  xp += 10;


  document.getElementById(
    "xp"
  ).innerText =
    xp;


  document.getElementById(
    "result"
  ).innerHTML =
    "✅ <strong>Correct!</strong>" +
    "<br>+10 XP";


  if (
    currentMode ===
    "battle"
  ) {

    correctBattleAnswer();

    return;
  }


  setTimeout(
    loadQuestion,
    1800
  );
}


/* ===================================================== */
/* WRONG                                                 */
/* ===================================================== */

function handleWrongAnswer() {

  lives--;


  if (
    lives < 0
  ) {
    lives = 0;
  }


  document.getElementById(
    "lives"
  ).innerText =
    lives;


  const correctIndexes =
    Array.isArray(
      currentQuestion.correct
    )
      ? currentQuestion.correct
      : [currentQuestion.correct];


  const correctText =
    correctIndexes
      .map(
        index => {

          return (
            String.fromCharCode(
              65 + index
            ) +
            ". " +
            currentQuestion.answers[
              index
            ]
          );
        }
      )
      .join("<br>");


  document.getElementById(
    "result"
  ).innerHTML =
    "❌ <strong>Incorrect</strong>" +

    "<br><br>" +

    "<strong>Correct answer:</strong>" +

    "<br>" +

    correctText;


  if (
    currentMode ===
    "battle"
  ) {

    wrongBattleAnswer();

    return;
  }


  if (
    lives <= 0
  ) {

    genericGameOver();

    return;
  }


  setTimeout(
    loadQuestion,
    2200
  );
}


/* ===================================================== */
/* HELPERS                                               */
/* ===================================================== */

function numberToWord(
  number
) {

  const words = {

    1: "ONE",
    2: "TWO",
    3: "THREE",
    4: "FOUR",
    5: "FIVE",
    6: "SIX"
  };


  return (
    words[number] ||
    number
  );
}


/* ===================================================== */
/* GENERIC GAME OVER                                     */
/* ===================================================== */

function genericGameOver() {

  questionLocked =
    true;


  document.getElementById(
    "question"
  ).innerText =
    "💀 Game Over";


  document.getElementById(
    "questionInstructions"
  ).innerText =
    "";


  document.getElementById(
    "result"
  ).innerHTML =
    "Final XP: " +
    xp;


  document.getElementById(
    "answersContainer"
  ).innerHTML =
    "";


  document.getElementById(
    "submitAnswerButton"
  ).style.display =
    "none";
}


/* ===================================================== */
/* BACK                                                  */
/* ===================================================== */

function backToMenu() {

  document.getElementById(
    "gameScreen"
  ).style.display =
    "none";


  document.getElementById(
    "mainMenu"
  ).style.display =
    "flex";


  document.getElementById(
    "answersContainer"
  ).innerHTML =
    "";


  document.getElementById(
    "result"
  ).innerHTML =
    "";


  document.getElementById(
    "questionInstructions"
  ).innerHTML =
    "";


  document.getElementById(
    "submitAnswerButton"
  ).style.display =
    "none";


  document.getElementById(
    "bossBanner"
  ).style.display =
    "none";


  currentMode =
    null;

  currentQuestion =
    null;

  selectedAnswers =
    [];

  questionLocked =
    false;
}


/* ===================================================== */
/* EVENTS                                                */
/* ===================================================== */

document.getElementById(
  "submitAnswerButton"
).addEventListener(
  "click",
  submitMultipleAnswer
);


document.getElementById(
  "backToMenuButton"
).addEventListener(
  "click",
  backToMenu
);


</script>


</body>

</html>
